<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg-canvas { fill: #FFF8EC; }
      .border-ink { stroke: #111111; stroke-width: 8; }
      .text-display { font-family: 'Space Grotesk', 'Bricolage Grotesque', system-ui, -apple-system, sans-serif; font-weight: 900; }
      .text-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; }
      .text-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" class="bg-canvas" />

  <!-- Outer Hard Border -->
  <rect x="24" y="24" width="1152" height="582" fill="#FFF8EC" stroke="#111111" stroke-width="8" />

  <!-- Hard Shadow for Inner Container -->
  <rect x="76" y="76" width="1064" height="494" fill="#111111" />

  <!-- Inner Main Card -->
  <rect x="64" y="64" width="1064" height="494" fill="#FFFFFF" stroke="#111111" stroke-width="6" />

  <!-- Top Pill / Badge -->
  <g transform="translate(112, 110)">
    <rect x="0" y="0" width="410" height="48" fill="#FFD400" stroke="#111111" stroke-width="4" />
    <!-- Orange Rotated Logo Mark -->
    <rect x="20" y="14" width="20" height="20" fill="#FF6B1A" stroke="#111111" stroke-width="3" rx="2" transform="rotate(-12 30 24)" />
    <text x="56" y="32" class="text-mono" font-size="18" fill="#111111" letter-spacing="2">DVSIET, MEERUT</text>
  </g>

  <!-- Main Headline -->
  <text x="112" y="246" class="text-display" font-size="82" fill="#111111" letter-spacing="-2">
    STARTUP CONCLAVE 1.0
  </text>

  <!-- Tagline Banner -->
  <g transform="translate(112, 290)">
    <rect x="0" y="0" width="760" height="74" fill="#FF6B1A" stroke="#111111" stroke-width="4" />
    <text x="28" y="50" class="text-display" font-size="38" fill="#FFFFFF" letter-spacing="-0.5">
      Where Ideas Meet Capital.
    </text>
  </g>

  <!-- Subtitle / Location Footer inside card -->
  <line x1="112" y1="420" x2="1016" y2="420" stroke="#111111" stroke-width="4" stroke-dasharray="8 8" />

  <text x="112" y="476" class="text-mono" font-size="22" fill="#111111">
    STARTUP CONCLAVE 1.0 · DVSIET, Meerut · Where Ideas Meet Capital.
  </text>

  <text x="112" y="510" class="text-sans" font-size="16" font-weight="600" fill="#111111" fill-opacity="0.75">
    Dewan V.S. Institute of Engineering &amp; Technology · NH-58, Partapur, Meerut
  </text>

  <!-- Corner Graphic Badge -->
  <g transform="translate(930, 110)">
    <rect x="0" y="0" width="86" height="86" fill="#FFF8EC" stroke="#111111" stroke-width="4" />
    <rect x="23" y="23" width="40" height="40" fill="#FF6B1A" stroke="#111111" stroke-width="4" rx="2" transform="rotate(-12 43 43)" />
  </g>
</svg>
